services:
  pokemon-notion-api:
    restart: unless-stopped
    build:
      context: ./PokemonNotionApi
      dockerfile: Dockerfile
    container_name: pokemon-notion-api
    ports:
      - "8090:8090"
    environment:
      - TZ=America/Sao_Paulo
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8090
      - App__PublicBaseUrl=${APP_PUBLIC_BASE_URL:-http://localhost:8090}
      - Database__ConnectionString=Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-pokemon};User=${MYSQL_USER:-pokemon};Password=${MYSQL_PASSWORD:-pokemon};TreatTinyAsBoolean=false
      - Notion__Token=${NOTION_TOKEN}
      - Notion__DatabaseId=${NOTION_DATABASE_ID}
      - Notion__LogDatabaseId=${NOTION_LOG_DATABASE_ID}
      - Notion__LogNameProperty=${NOTION_LOG_NAME_PROPERTY:-Log}
      - Notion__LogDateProperty=${NOTION_LOG_DATE_PROPERTY:-Data}
      - Notion__LogStatusProperty=${NOTION_LOG_STATUS_PROPERTY:-Status}
      - Notion__CardNameProperty=${NOTION_CARD_NAME_PROPERTY:-Name}
      - Notion__CardUrlProperty=${NOTION_CARD_URL_PROPERTY:-Link}
      - Notion__ChartUrlProperty=${NOTION_CHART_URL_PROPERTY:-Grafico de Precos}
      - Notion__PriceProperty=${NOTION_PRICE_PROPERTY:-Preço}
      - Notion__FoilPriceProperty=${NOTION_FOIL_PRICE_PROPERTY:-Valor Foil}
      - Notion__ReverseFoilPriceProperty=${NOTION_REVERSE_FOIL_PRICE_PROPERTY:-Valor Reverse Foil}
      - Notion__ImageProperty=${NOTION_IMAGE_PROPERTY:-Imagem}
      - Notion__TypeProperty=${NOTION_TYPE_PROPERTY:-Tipo}
      - Notion__RarityProperty=${NOTION_RARITY_PROPERTY:-Raridade}
      - Notion__NumberProperty=${NOTION_NUMBER_PROPERTY:-Número}
      - Notion__PrintedTotalProperty=${NOTION_PRINTED_TOTAL_PROPERTY:-printedTotal}
      - Notion__StatusProperty=${NOTION_STATUS_PROPERTY:-Status}
      - Notion__NotStartedStatusValue=${NOTION_NOT_STARTED_STATUS_VALUE:-Não iniciada}
      - Notion__DoneStatusValue=${NOTION_DONE_STATUS_VALUE:-Concluído}
    depends_on:
      - mysql

  pokemon-notion-sync:
    image: curlimages/curl:8.16.0
    container_name: pokemon-notion-sync
    restart: unless-stopped
    depends_on:
      - pokemon-notion-api
    environment:
      - TZ=BRT3
    command:
      - sh
      - -c
      - |
        while true; do
          hour=$$(date +%H)
          minute=$$(date +%M)
          second=$$(date +%S)
          hour=$${hour#0}
          minute=$${minute#0}
          second=$${second#0}
          now_seconds=$$(( $${hour:-0} * 3600 + $${minute:-0} * 60 + $${second:-0} ))
          next_seconds=7200

          for scheduled_seconds in 7200 28800 50400 72000; do
            if [ "$$now_seconds" -lt "$$scheduled_seconds" ]; then
              next_seconds=$$scheduled_seconds
              break
            fi
          done

          if [ "$$now_seconds" -ge 72000 ]; then
            sleep_seconds=$$((86400 - $$now_seconds + 7200))
          else
            sleep_seconds=$$((next_seconds - $$now_seconds))
          fi

          echo "Next Pokemon Notion sync in $${sleep_seconds}s at $$(date -Iseconds)"
          sleep "$$sleep_seconds"

          until curl -fsS http://pokemon-notion-api:8090/health >/dev/null; do
            echo "Pokemon Notion API is not ready at $$(date -Iseconds)"
            sleep 30
          done

          echo "Running Pokemon Notion sync at $$(date -Iseconds)"
          curl -sS --max-time 1800 -X POST http://pokemon-notion-api:8090/api/sync/run
          echo
        done

  mysql:
    image: mysql:8.4
    container_name: pokemon-notion-mysql
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-pokemon}
      - MYSQL_USER=${MYSQL_USER:-pokemon}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-pokemon}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
