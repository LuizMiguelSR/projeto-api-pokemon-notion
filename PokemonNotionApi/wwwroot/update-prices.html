<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atualizar preços</title>
  <link rel="icon" type="image/svg+xml" href="/pokeball.svg?v=20260704-4">
  <link rel="stylesheet" href="/pokemon-loading.css?v=20260704-4">
  <style>#start { width: auto; min-width: 220px; max-width: 100%; }</style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/pokeball.svg" alt="">
        <div>
          <strong>Atualizar preços</strong>
          <span>Preços de todas as cartas</span>
        </div>
      </div>
      <nav class="nav">
        <a href="/search">Busca</a>
        <a href="/prices">Preços</a>
      </nav>
    </header>

    <section class="hero">
      <div class="status">
        <span class="pokeball"></span>
        <h1 id="title">Preparando atualização</h1>
        <p id="message" aria-live="polite">Atualize os preços de todas as cartas com link da Liga Pokémon e salve o histórico no Notion.</p>
        <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
        <p class="progress-label" id="progressLabel" hidden>0%</p>
        <button id="start" type="button">Atualizar todos os preços</button>
        <pre class="result" id="result" hidden></pre>
      </div>
    </section>

    <footer class="page-footer">
      <span>Pokémon Notion API</span>
      <span>Sincronização e histórico de preços.</span>
    </footer>
  </main>

  <script src="/job-page.js?v=20260926-prices"></script>
  <script>
    setupJobPage({
      startEndpoint: "/api/jobs/update-prices",
      title: "Atualizando preços",
      doneTitle: "Preços atualizados!",
      errorTitle: "A atualização falhou."
    });
  </script>
</body>
</html>
