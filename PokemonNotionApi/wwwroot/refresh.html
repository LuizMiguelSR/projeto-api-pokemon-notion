<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atualizar URLs</title>
  <link rel="icon" type="image/svg+xml" href="/pokeball.svg?v=20260704-4">
  <link rel="stylesheet" href="/pokemon-loading.css?v=20260704-4">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/pokeball.svg" alt="">
        <div>
          <strong>Atualizar URLs</strong>
          <span>Atualização dos links do Notion</span>
        </div>
      </div>
      <nav class="nav">
        <a href="/search">Busca</a>
        <a href="/prices">Preços</a>
      </nav>
    </header>

    <section class="hero">
      <div class="status">
        <span class="pokeball"></span>
        <h1 id="title">Preparando atualização</h1>
        <p id="message">Ajustando os links dos gráficos com o domínio público atual.</p>
        <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
        <p class="progress-label" id="progressLabel" hidden>0%</p>
        <button id="start" type="button">Iniciar atualização</button>
        <pre class="result" id="result" hidden></pre>
      </div>
    </section>

    <footer class="page-footer">
      <span>Pokémon Notion API</span>
      <span>Sincronização e histórico de preços.</span>
    </footer>
  </main>

  <script src="/job-page.js?v=20260704-4"></script>
  <script>
    setupJobPage({
      startEndpoint: "/api/jobs/chart-urls-refresh",
      title: "Atualizando URLs",
      doneTitle: "Gotcha!!!",
      errorTitle: "A atualização falhou."
    });
  </script>
</body>
</html>
